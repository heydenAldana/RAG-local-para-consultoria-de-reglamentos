services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "5432:5432"
    volumes:
      # Volumen nombrado: persiste aunque se detenga/borre el contenedor -> nunca se re-siembra la DB
      - pgdata:/var/lib/postgresql/data
      # Solo se ejecuta la PRIMERA vez que el volumen está vacío (comportamiento nativo de la imagen postgres)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: rag_pgdata
